<div
  class="min-h-screen bg-gradient-to-br from-emerald-50 via-white to-emerald-50 py-6 px-4 sm:px-6 lg:px-8"
>
  <div class="max-w-7xl mx-auto">
    <div class="bg-white rounded-2xl shadow-md overflow-hidden">
      <!-- Header -->
      <div class="px-6 py-4 border-b border-gray-100 flex items-center gap-2">
        <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"
          />
        </svg>
        <span class="text-sm font-semibold text-gray-700">Reporte de Lotes de Terreno</span>
      </div>

      <div class="p-6 space-y-6">
        <!-- Filtro por manzana -->
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-2">
            Filtrar Reportes por Manzanas
          </label>
          <select
            [ngModel]="manzanoSeleccionadoId() ?? 'todas'"
            (ngModelChange)="onManzanoChange($event)"
            class="w-full sm:w-80 border border-gray-300 rounded-lg px-3 py-2 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:border-emerald-400 transition"
          >
            <option value="todas">Todas...</option>
            @for (m of manzanos(); track m.id) {
              <option [value]="m.id">Manzana {{ m.nombre }}</option>
            }
          </select>
        </div>

        <div class="border-t border-gray-100"></div>

        <!-- Fila 1: Total de Lotes + Lotes Disponibles -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <button
            (click)="descargarTotalLotes()"
            [disabled]="cargandoTotal()"
            class="flex items-center justify-center gap-2 border-2 border-purple-300 text-purple-600 hover:bg-purple-50 rounded-lg px-5 py-3 font-medium text-sm transition-all duration-200 disabled:opacity-60 disabled:cursor-not-allowed"
          >
            @if (cargandoTotal()) {
              <svg class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
                <circle
                  class="opacity-25"
                  cx="12"
                  cy="12"
                  r="10"
                  stroke="currentColor"
                  stroke-width="4"
                />
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z" />
              </svg>
              Generando...
            } @else {
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"
                />
              </svg>
              Total de Lotes
            }
          </button>

          <button
            (click)="descargarDisponibles()"
            [disabled]="cargandoDisponibles()"
            class="flex items-center justify-center gap-2 border-2 border-teal-400 text-teal-600 hover:bg-teal-50 rounded-lg px-5 py-3 font-medium text-sm transition-all duration-200 disabled:opacity-60 disabled:cursor-not-allowed"
          >
            @if (cargandoDisponibles()) {
              <svg class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
                <circle
                  class="opacity-25"
                  cx="12"
                  cy="12"
                  r="10"
                  stroke="currentColor"
                  stroke-width="4"
                />
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z" />
              </svg>
              Generando...
            } @else {
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"
                />
              </svg>
              Lotes Disponibles
            }
          </button>
        </div>

        <div class="border-t border-gray-100"></div>

        <!-- Fila 2: Lotes Vendidos + Lotes Reservados -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <button
            (click)="descargarVendidos()"
            [disabled]="cargandoVendidos()"
            class="flex items-center justify-center gap-2 border-2 border-purple-300 text-purple-600 hover:bg-purple-50 rounded-lg px-5 py-3 font-medium text-sm transition-all duration-200 disabled:opacity-60 disabled:cursor-not-allowed"
          >
            @if (cargandoVendidos()) {
              <svg class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
                <circle
                  class="opacity-25"
                  cx="12"
                  cy="12"
                  r="10"
                  stroke="currentColor"
                  stroke-width="4"
                />
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z" />
              </svg>
              Generando...
            } @else {
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
                />
              </svg>
              Lotes Vendidos
            }
          </button>

          <button
            (click)="descargarReservados()"
            [disabled]="cargandoReservados()"
            class="flex items-center justify-center gap-2 border-2 border-teal-400 text-teal-600 hover:bg-teal-50 rounded-lg px-5 py-3 font-medium text-sm transition-all duration-200 disabled:opacity-60 disabled:cursor-not-allowed"
          >
            @if (cargandoReservados()) {
              <svg class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
                <circle
                  class="opacity-25"
                  cx="12"
                  cy="12"
                  r="10"
                  stroke="currentColor"
                  stroke-width="4"
                />
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z" />
              </svg>
              Generando...
            } @else {
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
                />
              </svg>
              Lotes Reservados
            }
          </button>
        </div>

        <div class="border-t border-gray-100"></div>

        <!-- Fila 3: Total Lotes Detalle PDF + Reporte General Detallado -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <button
            (click)="descargarDetalle()"
            [disabled]="cargandoDetalle()"
            class="flex items-center justify-center gap-2 border-2 border-purple-300 text-purple-600 hover:bg-purple-50 rounded-lg px-5 py-3 font-medium text-sm transition-all duration-200 disabled:opacity-60 disabled:cursor-not-allowed"
          >
            @if (cargandoDetalle()) {
              <svg class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
                <circle
                  class="opacity-25"
                  cx="12"
                  cy="12"
                  r="10"
                  stroke="currentColor"
                  stroke-width="4"
                />
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z" />
              </svg>
              Generando...
            } @else {
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
                />
              </svg>
              Total Lotes Detalle PDF
            }
          </button>

          <button
            (click)="descargarGeneralDetallado()"
            [disabled]="cargandoGeneral()"
            class="flex items-center justify-center gap-2 border-2 border-teal-400 text-teal-600 hover:bg-teal-50 rounded-lg px-5 py-3 font-medium text-sm transition-all duration-200 disabled:opacity-60 disabled:cursor-not-allowed"
          >
            @if (cargandoGeneral()) {
              <svg class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
                <circle
                  class="opacity-25"
                  cx="12"
                  cy="12"
                  r="10"
                  stroke="currentColor"
                  stroke-width="4"
                />
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z" />
              </svg>
              Generando...
            } @else {
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
                />
              </svg>
              Reporte General Detallado
            }
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
